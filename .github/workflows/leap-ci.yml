name: leap-ci

on:
  pull_request:
    paths:
      - "LEAPINSIGHT_PATCHES.md"
      - "README.md"
      - "codex-rs/config/**"
      - "codex-rs/core-skills/**"
      - "codex-rs/core/**"
      - "docs/install.md"
      - "scripts/install/install-leap.sh"
      - ".github/workflows/leap-ci.yml"
      - ".github/workflows/leap-release.yml"
  push:
    branches:
      - "feat/skill-metadata-budget-config"
      - "leap/**"
    paths:
      - "LEAPINSIGHT_PATCHES.md"
      - "README.md"
      - "codex-rs/config/**"
      - "codex-rs/core-skills/**"
      - "codex-rs/core/**"
      - "docs/install.md"
      - "scripts/install/install-leap.sh"
      - ".github/workflows/leap-ci.yml"
      - ".github/workflows/leap-release.yml"
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  focused-skill-budget-tests:
    name: Focused skill budget tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: core-skills default budget tests
        run: cargo test -p codex-core-skills default_budget --lib
      - name: core-skills budgeted rendering tests
        run: cargo test -p codex-core-skills budgeted_rendering_ --lib
      - name: core config schema test
        run: cargo test -p codex-core config_schema_matches_fixture --lib
      - name: bundled skills config parse test
        run: cargo test -p codex-core parses_bundled_skills_config --lib

  installer-smoke-tests:
    name: Installer smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: shell syntax
        run: sh -n scripts/install/install-leap.sh
      - name: supported target dry run
        run: |
          set -euo pipefail
          CODEX_LEAP_TARGET=aarch64-apple-darwin \
            CODEX_LEAP_NO_PATH_UPDATE=1 \
            sh scripts/install/install-leap.sh --dry-run --release v0.0.0-leap
      - name: unsupported target error
        run: |
          set -euo pipefail
          set +e
          output="$(CODEX_LEAP_TARGET=x86_64-unknown-linux-musl sh scripts/install/install-leap.sh --dry-run --release v0.0.0-leap 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F "currently support macOS Apple Silicon"
      - name: codex command name guard
        run: |
          set -euo pipefail
          set +e
          output="$(CODEX_LEAP_BIN_NAME=codex sh scripts/install/install-leap.sh --dry-run --release v0.0.0-leap 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F "Refusing to install Codex Leap as \"codex\""
